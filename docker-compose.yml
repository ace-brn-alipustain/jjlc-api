services:
  backend:
    build: .
    container_name: jjlc-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  mysql:
    image: mysql:8.4
    container_name: jjlc-mysql
    restart: unless-stopped
    environment:
        MYSQL_DATABASE: jjlcDB
        MYSQL_USER: admin
        MYSQL_PASSWORD: root
        MYSQL_ROOT_PASSWORD: root
    ports:
      - '3309:3306'
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: